[package]
name = "pieeg-local-bridge"
version = "0.1.0"
edition = "2021"
description = "Vendor-neutral browser-to-local-network bridge with pluggable protocol adapters (OSC first)."
license = "CC-BY-NC-4.0"
repository = "https://github.com/pieeg-club/PiEEG-server-plus"
default-run = "pieeg-local-bridge"

[[bin]]
name = "pieeg-local-bridge"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rosc = "0.10"
mdns-sd = "0.11"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
url = "2"
webbrowser = "1"
webrtc = "0.17.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json", "charset"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "tls12", "logging"] }
tray-icon = "0.19"
image = "0.25"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

# Ultra-small, fast-starting release binary.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
