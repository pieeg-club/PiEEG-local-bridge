<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PiEEG Bridge — WebRTC Test</title>
  <style>
    body { font-family: system-ui; max-width: 800px; margin: 40px auto; padding: 20px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
    pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; }
    #messages { max-height: 400px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>PiEEG Bridge — WebRTC Connection Test</h1>
  
  <div id="status" class="status info">Ready to connect</div>
  
  <label for="sessionCode">Pairing Code (from bridge UI)</label>
  <input id="sessionCode" placeholder="e.g. UFUD3P" style="margin-bottom: 10px" />
  
  <button id="connectBtn" onclick="connect()">Connect via WebRTC</button>
  <button id="sendBtn" onclick="sendTestData()" disabled>Send Test Data</button>
  
  <h2>Messages</h2>
  <div id="messages"></div>

  <script>
    let pc = null;
    let dataChannel = null;

    function log(msg, level = 'info') {
      const div = document.createElement('div');
      div.className = `status ${level}`;
      div.textContent = msg;
      document.getElementById('messages').prepend(div);
      console.log(msg);
    }

    async function connect() {
      try {
        const sessionCode = document.getElementById('sessionCode').value.trim().toUpperCase();
        if (!sessionCode) {
          log('❌ Please enter the pairing code from the bridge UI', 'error');
          return;
        }
        
        document.getElementById('status').textContent = 'Connecting...';
        document.getElementById('connectBtn').disabled = true;

        // Create peer connection
        pc = new RTCPeerConnection({
          iceServers: [] // No STUN/TURN needed for localhost
        });

        // Create data channel
        dataChannel = pc.createDataChannel('pieeg-bridge', {
          ordered: true
        });

        dataChannel.onopen = () => {
          log('✅ Data channel open — connection established!', 'success');
          document.getElementById('status').textContent = '✅ Connected';
          document.getElementById('status').className = 'status success';
          document.getElementById('sendBtn').disabled = false;
        };

        dataChannel.onclose = () => {
          log('❌ Data channel closed', 'error');
          document.getElementById('status').textContent = 'Disconnected';
          document.getElementById('status').className = 'status error';
          document.getElementById('sendBtn').disabled = true;
        };

        dataChannel.onmessage = (evt) => {
          log(`📨 Received: ${evt.data}`);
        };

        dataChannel.onerror = (err) => {
          log(`❌ Data channel error: ${err}`, 'error');
        };

        // Generate offer
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        // Wait for ICE gathering to complete
        await new Promise((resolve) => {
          if (pc.iceGatheringState === 'complete') {
            resolve();
          } else {
            pc.addEventListener('icegatheringstatechange', () => {
              if (pc.iceGatheringState === 'complete') {
                resolve();
              }
            });
          }
        });

        log('📤 Sending SDP offer to bridge...');

        // Send offer to bridge and get answer
        const response = await fetch('http://127.0.0.1:47800/signal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sdp: pc.localDescription.sdp,
            type: pc.localDescription.type,
            session_id: sessionCode
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${await response.text()}`);
        }

        const answer = await response.json();
        log('📥 Received SDP answer from bridge');

        await pc.setRemoteDescription({
          type: answer.type,
          sdp: answer.sdp
        });

        log('⏳ Waiting for data channel to open...', 'info');

      } catch (err) {
        log(`❌ Connection failed: ${err.message}`, 'error');
        document.getElementById('status').textContent = `Error: ${err.message}`;
        document.getElementById('status').className = 'status error';
        document.getElementById('connectBtn').disabled = false;
      }
    }

    function sendTestData() {
      if (!dataChannel || dataChannel.readyState !== 'open') {
        log('❌ Data channel not open', 'error');
        return;
      }

      // Test 1: Simple channel data (should be flattened to OSC)
      const testData1 = {
        channels: [0.1, 0.2, 0.3, 0.4],
        alpha: 0.42,
        beta: 0.67,
        t: Date.now()
      };

      // Test 2: Explicit OSC envelope (should be forwarded verbatim)
      const testData2 = {
        osc: {
          address: "/avatar/parameters/EEG_Alpha",
          args: [0.85]
        }
      };

      log(`📤 Sending test data 1 (flattened): ${JSON.stringify(testData1)}`);
      dataChannel.send(JSON.stringify(testData1));

      setTimeout(() => {
        log(`📤 Sending test data 2 (explicit OSC): ${JSON.stringify(testData2)}`);
        dataChannel.send(JSON.stringify(testData2));
      }, 500);
    }

    // Auto-cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (dataChannel) dataChannel.close();
      if (pc) pc.close();
    });
  </script>
</body>
</html>
